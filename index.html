const CATS={};VIDS.forEach(w=>{(CATS[w.cat]=CATS[w.cat]||[]).push(w);});
const ORDER=["纪录片","短片","人物IP","文旅","宣传片","AIGC","访谈"];
const sKeys=Object.keys(CATS).sort((a,b)=>{const ra=ORDER.indexOf(a),rb=ORDER.indexOf(b);return(ra<0?99:ra)-(rb<0?99:rb)||a.localeCompare(b,"zh");});

function renderStatic(){
  const d=T();
  document.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;if(d[k]!==undefined)el.textContent=d[k];});
  document.getElementById("meta").innerHTML=d.meta;
  const tags=d.tags.map(s=>`<span class="tag2">${s}</span>`).join("");
  document.querySelector("[data-k=tags]").innerHTML=tags;
  const w=document.getElementById("aboutMore");
  w.innerHTML=`<div class="wrap2"><div class="detail"><p>${d.aboutText.join("</p><p>")}</p></div></div><button class="more-btn" style="margin-top:14px" onclick="this.parentElement.classList.toggle('open')">${d.aboutMore}</button>`;
  document.getElementById("jobs").innerHTML=d.jobs.map(j=>`<div class="job"><div class="job-head" onclick="this.closest('.job').classList.toggle('open')"><div class="t">${j.t}</div><div class="o">${j.o}</div><div class="r">${j.r}</div><span class="arr">▸</span></div><div class="job-body"><ul>${j.d.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`).join("");
  document.getElementById("skills").innerHTML=d.skillGroups.map(g=>`<div class="skill"><h5>${g[0]}</h5><div class="sg">${g[1].map(x=>`<span>${x}</span>`).join("")}</div></div>`).join("");
  document.getElementById("contact").innerHTML=d.contactInfo.map(c=>`<div class="c"><div class="k">${c[1]}</div><div class="v">${/@/.test(c[2])?`<a href="mailto:${c[2]}">${c[2]}</a>`:c[2]}</div></div>`).join("");
  document.getElementById("langBtn").textContent=d.btn;
  document.getElementById("imgBtn").textContent=d.imgBtn;
  renderChips();renderWall();
}
let activeCat="all";
function renderChips(){
  const d=T();const el=document.getElementById("chips");
  el.innerHTML=[`<span class="chip active" data-c="all">${d.all} ${VIDS.length}</span>`].concat(sKeys.map(k=>`<span class="chip" data-c="${k}">${tagOf(k)} ${CATS[k].length}</span>`)).join("");
  el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{el.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");activeCat=c.dataset.c;renderWall();}));
}
function renderWall(){
  const d=T();const list=activeCat==="all"?VIDS:(CATS[activeCat]||[]);
  const w=document.getElementById("wall");
  if(!list.length){w.innerHTML=`<div class="empty">${d.all==="全部"?"暂无作品":"No works yet"}</div>`;return;}
  w.innerHTML=list.map((v,i)=>`<div class="card" data-i="${i}"><div class="th">${v.poster?`<img src="${v.poster}" loading="lazy">`:(isVid(v.file)?`<video muted preload="metadata" src="${v.file}"></video>`:`<img src="${v.file}" loading="lazy">`)}</div><span class="ct">${tagOf(v.cat)}</span><span class="pv">▶</span><span class="tt">${v.title||""}</span></div>`).join("");
  w.querySelectorAll(".card").forEach(cd=>cd.addEventListener("click",()=>openLb(+cd.dataset.i,"v")));
}
const imgBtn=document.getElementById("imgBtn"),imgs=document.getElementById("imgs");
imgBtn.onclick=()=>{imgs.classList.toggle("show");imgBtn.textContent=T().imgBtn+(imgs.classList.contains("show")?" ▲":" ▶");if(imgs.classList.contains("show"))renderImgs();};
function renderImgs(){
  imgs.innerHTML=IMGS.length?IMGS.map((v,i)=>`<div class="imgc" data-i="${i}"><img src="${v.file}" loading="lazy"><div class="cap">${v.title||""}</div></div>`).join(""):`<div class="empty">暂无</div>`;
  imgs.querySelectorAll(".imgc").forEach(cd=>cd.addEventListener("click",()=>openLb(+cd.dataset.i,"i")));
}
const lb=document.getElementById("lb"),lbM=document.getElementById("lbM"),lbT=document.getElementById("lbT");
let mode="v",cur=-1;const listOf=()=>mode==="v"?VIDS:IMGS;
function openLb(i,m){mode=m;const v=listOf();if(!v[i])return;cur=i;const x=v[i];
  lbM.innerHTML=isVid(x.file)?`<video src="${x.file}" controls autoplay playsinline></video>`:`<img src="${x.file}">`;
  lbT.textContent=x.title||"";lb.classList.add("open");}
document.getElementById("lbClose").onclick=()=>{lb.classList.remove("open");lbM.innerHTML="";};
lb.addEventListener("click",e=>{if(e.target===lb){lb.classList.remove("open");lbM.innerHTML="";}});
document.getElementById("lbPrev").onclick=e=>{e.stopPropagation();const v=listOf();openLb((cur-1+v.length)%v.length,mode);};
document.getElementById("lbNext").onclick=e=>{e.stopPropagation();const v=listOf();openLb((cur+1)%v.length,mode);};
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")document.getElementById("lbClose").click();if(e.key==="ArrowLeft")document.getElementById("lbPrev").click();if(e.key==="ArrowRight")document.getElementById("lbNext").click();});
function jump(id){document.getElementById(id).scrollIntoView({behavior:"smooth"});}
function toggleLang(){lang=lang==="zh"?"en":"zh";localStorage.setItem("pf_lang",lang);renderStatic();renderImgBtn();}
function renderImgBtn(){imgBtn.textContent=T().imgBtn+(imgs.classList.contains("show")?" ▲":" ▶");}
document.getElementById("langBtn").onclick=toggleLang;
document.getElementById("year").textContent=new Date().getFullYear();
renderStatic();
</script>
</body>
</html>
