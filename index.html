<style>
  :root{
    --bg:#0d0e11; --card:#15171c; --line:#24272e; --text:#eceef2; --muted:#9aa0ac; --accent:#e25555; --accent2:#f0a35e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px}
  .lang-btn{position:fixed;top:16px;right:20px;z-index:90;border:1px solid var(--line);background:rgba(21,23,28,.85);backdrop-filter:blur(8px);color:var(--text);border-radius:999px;padding:5px 15px;font-size:12.5px;cursor:pointer}
  .lang-btn:hover{border-color:var(--accent)}
  nav{position:sticky;top:0;z-index:80;background:rgba(13,14,17,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}

  .brand{font-weight:800;letter-spacing:1px;margin-right:auto;white-space:nowrap;font-size:15px}
  .brand small{color:var(--accent)}
  .nav-item{border:none;background:none;color:var(--muted);padding:8px 13px;font-size:14px;cursor:pointer;white-space:nowrap;border-radius:8px;letter-spacing:.5px}
  .nav-item:hover{color:var(--text)}
  .nav-item.active{color:var(--text);background:var(--card)}
  .nav-item .no{color:var(--accent);font-size:11px;margin-right:4px;font-family:ui-monospace,monospace}
  section{display:none;padding:36px 0 70px}
  section.active{display:block}
  .h2{font-size:22px;font-weight:800;letter-spacing:2px}
  .h2 small{color:var(--accent);font-size:13px}
  .h2sub{color:var(--muted);font-size:13px;margin:4px 0 24px}
  .about-top{display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap}
  .about-ava{width:150px;height:150px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex-shrink:0;background:var(--card)}
  .about-text{flex:1;min-width:280px}
  .about-text h3{font-size:28px;letter-spacing:2px}
  .about-text .role{color:var(--accent2);margin:8px 0 2px;font-size:16px;font-weight:600}
  .about-text .meta{color:var(--muted);font-size:13px;margin-bottom:14px}
  .about-text .meta span{margin-right:16px}
  .about-text p{color:#c9ccd4;font-size:14.5px;margin-bottom:10px}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .tags span{border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:12px;color:var(--muted)}
  .block{margin-top:34px}
  .block h4{font-size:15px;letter-spacing:1px;color:var(--accent2);margin-bottom:12px}
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 28px}
  .tl-item::before{content:"";position:absolute;left:-24px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(226,85,85,.2)}
  .tl-time{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--accent2)}
  .tl-role{font-weight:700;margin:3px 0 1px;font-size:16px}
  .tl-org{color:var(--muted);font-size:13.5px;margin-bottom:6px}
  .tl-desc{color:#c9ccd4;font-size:13.5px;padding-left:18px}
  .tl-desc li{margin-bottom:3px}
  .chips{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 15px;font-size:13.5px;cursor:pointer;transition:all .15s;white-space:nowrap}
  .chip b{font-weight:600}
  .chip:hover{color:var(--text)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .count-line{color:var(--muted);font-size:13px;margin:4px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
  .card{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;position:relative;aspect-ratio:16/9;transition:transform .2s,border-color .2s}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .thumb{position:absolute;inset:0;background:#000;overflow:hidden}
  .thumb video,.thumb img{width:100%;height:100%;object-fit:cover}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.72))}
  .cat-tag{position:absolute;top:12px;left:12px;z-index:2;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:11.5px;padding:3px 12px;border-radius:999px}
  .play-ico{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:56px;height:56px;border-radius:50%;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;opacity:0;transition:opacity .2s}
  .card:hover .play-ico{opacity:1;background:var(--accent)}
  .title{position:absolute;left:14px;right:14px;bottom:11px;z-index:2;color:#fff;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-link{margin:30px 0 4px;border-top:1px solid var(--line);padding-top:20px}

  .img-card{border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--card)}

  .img-cap{padding:8px 12px;font-size:12px;color:var(--muted)}

  .c-card .v{color:var(--muted);font-size:14px;word-break:break-all}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px;grid-column:1/-1}
  .lb{position:fixed;inset:0;background:rgba(5,6,8,.94);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
  .lb.open{display:flex}
  .lb-box{max-width:min(1060px,92vw);width:100%;max-height:90vh;background:#000;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .lb-media{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .lb-media video,.lb-media img{max-width:100%;max-height:calc(90vh - 96px)}
  .lb-info{padding:11px 18px;display:flex;background:var(--card)}
  .lb-info h3{font-size:14px;flex:1}
  .lb-close{position:fixed;top:14px;right:22px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer;z-index:101}
  .lb-prev,.lb-next{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#fff;width:46px;height:46px;border-radius:50%;font-size:18px;cursor:pointer;z-index:101}
  .lb-prev{left:14px}.lb-next{right:14px}
  footer{border-top:1px solid var(--line);padding:24px 0 36px;text-align:center;color:var(--muted);font-size:12.5px}
  @media(max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:10px}.about-ava{width:110px;height:110px}}
</style>
</head>

const RAW=(window.WORKS||[]).map(w=>Object.assign({cat:"未分类"},w));

function tagOf(cat){const b=cat.replace(/\*\*/g," ").replace(/^[\d.\s\u00b7·\-]+/,"").trim();for(const r of TAG_RULES){if(r[0].test(cat)||r[0].test(b))return lang==="en"?r[2]:r[1];}return b;}

  document.getElementById("aSkills").innerHTML=d.skills.map(s=>`<span>${s}</span>`).join("");
  document.getElementById("timeline").innerHTML=d.jobs.map(j=>`<div class="tl-item"><div class="tl-time">${j.time}</div><div class="tl-role">${j.role}</div><div class="tl-org">${j.org}</div><ul class="tl-desc">${j.d.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("");
  document.getElementById("contactCards").innerHTML=d.contact.map(c=>`<div class="c-card"><div class="ic">${c.ic}</div><div class="t">${c.t}</div><div class="v">${c.v.includes("@")?`<a href="mailto:${c.v}">${c.v}</a>`:c.v}</div></div>`).join("");
  document.getElementById("langBtn").textContent=d.btn;
  document.getElementById("imgSubBtn").textContent="📊 "+d.imgSub;
}
let activeCat="all",imgOpen=false;
function renderWorks(){
  const d=T();
  document.getElementById("worksSub").textContent=d.play+" · "+VIDS.length+" "+d.worksN;
  const m=document.getElementById("worksMain");
  m.innerHTML=`<div class="chips" id="chips"></div><div class="count-line" id="countLine"></div><div class="grid" id="grid"></div>`;
  const chips=document.getElementById("chips");
  chips.innerHTML=[`<span class="chip active" data-c="all"><b>${d.all}</b> ${VIDS.length}</span>`].concat(sortedKeys.map(k=>`<span class="chip" data-c="${k}"><b>${tagOf(k)}</b> ${CATS[k].length}</span>`)).join("");
  chips.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{chips.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");activeCat=c.dataset.c;renderGrid();}));
  renderGrid();
  document.getElementById("imgSubBtn").onclick=()=>{imgOpen=!imgOpen;renderImgSub();};
  renderImgSub();
}
function renderGrid(){
  const d=T();const list=activeCat==="all"?VIDS:(CATS[activeCat]||[]);
  document.getElementById("countLine").textContent=list.length+" "+d.worksN;
  const g=document.getElementById("grid");
  if(!list.length){g.innerHTML=`<div class="empty">${d.none}</div>`;return;}
  g.innerHTML=list.map((w,i)=>`<div class="card" data-i="${i}"><div class="thumb">${w.poster?`<img src="${w.poster}">`:(isVid(w.file)?`<video muted preload="metadata" src="${w.file}"></video>`:`<img src="${w.file}">`)}</div><span class="cat-tag">${tagOf(w.cat)}</span><span class="play-ico">▶</span><span class="title">${w.title||""}</span></div>`).join("");
  g.querySelectorAll(".card").forEach(cd=>cd.addEventListener("click",()=>openLb(+cd.dataset.i,"vids")));
}
function renderImgSub(){
  const d=T();const box=document.getElementById("imgSub");const btn=document.getElementById("imgSubBtn");
  btn.textContent="📊 "+d.imgSub+(imgOpen?" ▲":" ▶");
  if(!imgOpen){box.innerHTML="";return;}
  if(!IMGS.length){box.innerHTML=`<div class="empty">${d.imgNone}</div>`;return;}
  box.innerHTML=`<div class="img-grid">${IMGS.map((w,i)=>`<div class="img-card" data-i="${i}"><img src="${w.file}" loading="lazy"><div class="img-cap">${w.title||""}</div></div>`).join("")}</div>`;
  box.querySelectorAll(".img-card").forEach(cd=>cd.addEventListener("click",()=>openLb(+cd.dataset.i,"imgs")));
}
/* ===== 灯箱 ===== */
const lb=document.getElementById("lb"),lbMedia=document.getElementById("lbMedia"),lbTitle=document.getElementById("lbTitle");
let mode="vids",cur=-1;
function listOf(){return mode==="vids"?VIDS:IMGS;}
function openLb(i,m){mode=m||"vids";const v=listOf();if(!v[i])return;cur=i;const w=v[i];
  lbMedia.innerHTML=isVid(w.file)?`<video src="${w.file}" controls autoplay playsinline></video>`:`<img src="${w.file}">`;
  lbTitle.textContent=w.title||"";lb.classList.add("open");}
document.getElementById("lbClose").onclick=()=>{lb.classList.remove("open");lbMedia.innerHTML="";};
lb.addEventListener("click",e=>{if(e.target===lb){lb.classList.remove("open");lbMedia.innerHTML="";}});
document.getElementById("lbPrev").onclick=e=>{e.stopPropagation();const v=listOf();openLb((cur-1+v.length)%v.length,mode);};
document.getElementById("lbNext").onclick=e=>{e.stopPropagation();const v=listOf();openLb((cur+1)%v.length,mode);};
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")document.getElementById("lbClose").click();
  if(e.key==="ArrowLeft")document.getElementById("lbPrev").click();
  if(e.key==="ArrowRight")document.getElementById("lbNext").click();});
/* ===== 语言切换 ===== */
function toggleLang(){lang=lang==="zh"?"en":"zh";localStorage.setItem("pf_lang",lang);renderContent();if(document.getElementById("sec-works").classList.contains("active"))renderWorks();}
document.getElementById("year").textContent=new Date().getFullYear();
renderContent();renderWorks();
</script>
