<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曾钰茗作品集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎬</text></svg>">
<style>
  :root{--bg:#0d0e11;--card:#15171c;--line:#24272e;--text:#eceef2;--muted:#9aa0ac;--accent:#e25555;--accent2:#f0a35e}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
  .lang-btn{position:fixed;top:14px;right:18px;z-index:90;border:1px solid var(--line);background:rgba(21,23,28,.85);backdrop-filter:blur(8px);color:var(--text);border-radius:999px;padding:5px 14px;font-size:12px;cursor:pointer}
  nav{position:sticky;top:0;z-index:80;background:rgba(13,14,17,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;gap:2px;max-width:1160px;margin:0 auto;padding:0 22px;height:50px}
  .brand{font-weight:800;letter-spacing:1px;margin-right:auto;white-space:nowrap;font-size:15px}
  .brand small{color:var(--accent)}
  .nav-item{border:none;background:none;color:var(--muted);padding:7px 12px;font-size:13.5px;cursor:pointer;white-space:nowrap;border-radius:8px}
  .nav-item:hover{color:var(--text)}
  .nav-item .no{color:var(--accent);font-size:11px;margin-right:3px;font-family:ui-monospace,monospace}
  section{padding:52px 0 8px;scroll-margin-top:58px}
  .h2{font-size:19px;font-weight:800;letter-spacing:2px;margin-bottom:16px}
  .h2 small{color:var(--accent);font-size:12px;margin-right:6px}
  /* 01 关于 */
  .about{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
  .about img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex-shrink:0}
  .about .info{flex:1;min-width:240px}
  .about h1{font-size:26px;letter-spacing:2px}
  .about .role{color:var(--accent2);font-weight:600;margin:2px 0 6px;font-size:15px}
  .about .meta{color:var(--muted);font-size:13px}
  .about .meta span{margin-right:14px;white-space:nowrap}
  .chips2{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .chips2 span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:11.5px;color:var(--muted)}
  /* 02 经历 */
  .job{display:flex;gap:16px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
  .job:last-child{border-bottom:none}
  .job .t{font-family:ui-monospace,monospace;font-size:12.5px;color:var(--accent2);min-width:150px}
  .job .o{font-weight:600;font-size:14.5px}
  .job .r{color:var(--muted);font-size:13px;margin-left:10px}
  /* 03 作品 */
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 14px;font-size:13px;cursor:pointer}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:14px 0}
  .card{border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line);cursor:pointer;position:relative;aspect-ratio:16/9}
  .card:hover{border-color:var(--accent)}
  .thumb{position:absolute;inset:0;background:#000;overflow:hidden}
  .thumb video,.thumb img{width:100%;height:100%;object-fit:cover}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.75))}
  .cat-tag{position:absolute;top:10px;left:10px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 10px;border-radius:999px}
  .play-ico{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;opacity:0;transition:opacity .2s}
  .card:hover .play-ico{opacity:1;background:var(--accent)}
  .title{position:absolute;left:12px;right:12px;bottom:9px;z-index:2;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .img-sub{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .img-toggle{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:10px;padding:9px 18px;font-size:13px;cursor:pointer}
  .img-toggle:hover{color:var(--text);border-color:var(--accent2)}
  .img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:14px}
  .img-card{border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:var(--card)}
  .img-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .img-cap{padding:6px 10px;font-size:11.5px;color:var(--muted)}
  /* 04 联系 */
  .contact{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:40px}
  .c-item{border:1px solid var(--line);border-radius:12px;padding:14px 20px;background:var(--card);min-width:200px}
  .c-item .k{font-size:12px;color:var(--muted)}
  .c-item .v{font-size:15px;font-weight:600;margin-top:3px}
  .c-item .v a{color:var(--accent2);text-decoration:none}
  footer{border-top:1px solid var(--line);padding:20px 0 34px;text-align:center;color:var(--muted);font-size:12px}
  .empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
  .lb{position:fixed;inset:0;background:rgba(5,6,8,.94);z-index:100;display:none;align-items:center;justify-content:center;padding:22px}
  .lb.open{display:flex}
  .lb-box{max-width:min(1040px,92vw);width:100%;max-height:90vh;background:#000;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .lb-media{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .lb-media video,.lb-media img{max-width:100%;max-height:calc(90vh - 90px)}
  .lb-info{padding:10px 16px;background:var(--card)}
  .lb-info h3{font-size:13.5px}
  .lb-close{position:fixed;top:14px;right:22px;font-size:30px;color:#fff;background:none;border:none;cursor:pointer;z-index:101}
  .lb-prev,.lb-next{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);color:#fff;width:44px;height:44px;border-radius:50%;font-size:17px;cursor:pointer;z-index:101}
  .lb-prev{left:12px}.lb-next{right:12px}
  @media(max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:10px}.job .t{min-width:110px}}
</style>
</head>
<body>
<button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
<nav>
  <div class="nav-in">
    <span class="brand">曾钰茗<small> · PF</small></span>
    <button class="nav-item" onclick="jump('s-about')"><span class="no">01</span><span data-k="about">简介</span></button>
    <button class="nav-item" onclick="jump('s-career')"><span class="no">02</span><span data-k="career">经历</span></button>
    <button class="nav-item" onclick="jump('s-works')"><span class="no">03</span><span data-k="works">作品</span></button>
    <button class="nav-item" onclick="jump('s-contact')"><span class="no">04</span><span data-k="contact">联系</span></button>
  </div>
</nav>

<main class="wrap">
  <section id="s-about">
    <div class="about">
      <img src="avatar.jpg" alt="avatar" onerror="this.style.display='none'">
      <div class="info">
        <h1 data-k="name">曾钰茗</h1>
        <div class="role" data-k="objective"></div>
        <div class="meta" data-k="meta"></div>
        <div class="chips2" data-k="skills"></div>
      </div>
    </div>
  </section>

  <section id="s-career">
    <div class="h2"><small>02</small><span data-k="careerT"></span></div>
    <div id="jobs"></div>
  </section>

  <section id="s-works">
    <div class="h2"><small>03</small><span data-k="worksT"></span></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
    <div class="img-sub"><button class="img-toggle" id="imgBtn"></button><div id="imgSub"></div></div>
  </section>

  <section id="s-contact">
    <div class="h2"><small>04</small><span data-k="contactT"></span></div>
    <div class="contact" id="contact"></div>
  </section>
</main>

<footer>© <span id="year"></span> 曾钰茗 · Portfolio</footer>

<div class="lb" id="lb">
  <button class="lb-close" id="lbClose">×</button>
  <button class="lb-prev" id="lbPrev">‹</button>
  <button class="lb-next" id="lbNext">›</button>
  <div class="lb-box"><div class="lb-media" id="lbMedia"></div><div class="lb-info"><h3 id="lbTitle"></h3></div></div>
</div>

<script src="works.js"></script>
<script>
const D={
zh:{name:"曾钰茗",objective:"短视频拍摄剪辑 · 内容运营",meta:"📍广西桂林 · 🎂2002 · 🎓北海职院·影视传媒 · 📞18969806453 · ✉️2556631157@qq.com",
  skills:["拍剪运营3年+","文旅/宣传/短剧/电商","AI辅助创作","单月8条爆款","PR · AE · PS · 达芬奇 · 剪映"],
  careerT:"工作经历",
  jobs:[["2023.08 — 今","桂林七少汽车销售","拍摄剪辑"],["2023.04 — 2023.08","广西来也文化传媒","拍摄剪辑运营"],["2022.08 — 2023.01","广州星拓传媒","拍摄剪辑"],["2022.01 — 2022.08","广州再酷一点传媒","摄影剪辑"]],
  worksT:"作品",all:"全部",worksN:"个",imgBtn:"📊 运营数据图片",imgNone:"暂无",none:"暂无",contactT:"联系方式",
  contact:[["📱","电话","18969806453"],["📧","邮箱","2556631157@qq.com"],["📍","所在地","广西桂林"]],btn:"EN",about:"简介",career:"经历",works:"作品",contact:"联系"},
en:{name:"Zeng Yuming",objective:"Short-Video Shooting & Editing · Content Ops",meta:"📍Guilin, Guangxi · 🎂2002 · 🎓Beihai Voc. Film & Media · 📞18969806453 · ✉️2556631157@qq.com",
  skills:["3+ yrs shoot/edit/ops","Travel/Promo/Drama/E-com","AI-assisted creation","8 viral videos / month","PR · AE · PS · Resolve · FCPX · JY"],
  careerT:"Experience",
  jobs:[["2023.08 — Now","Guilin Qishao Auto Sales","Camera & Editing"],["2023.04 — 2023.08","Laiye Culture Media","Shoot / Edit / Ops"],["2022.08 — 2023.01","Guangzhou Xintuo Media","Camera & Editing"],["2022.01 — 2022.08","Guangzhou Zaiku Yidian","Photo & Editing"]],
  worksT:"Works",all:"All",worksN:"",imgBtn:"📊 Analytics (images)",imgNone:"None yet",none:"None yet",contactT:"Contact",
  contact:[["📱","Phone","18969806453"],["📧","Email","2556631157@qq.com"],["📍","Location","Guilin, Guangxi"]],btn:"中",about:"About",career:"Career",works:"Works",contact:"Contact"}
};
let lang=localStorage.getItem("pf_lang")||(navigator.language&&navigator.language.toLowerCase().startsWith("zh")?"zh":"en");
const T=()=>D[lang];
const RAW=(window.WORKS||[]).map(w=>Object.assign({cat:"未分类"},w));
const isVid=f=>/\.(mp4|mov|webm|m4v)$/i.test(f);
const RULES=[[/个人ip/i,"人物IP","Personal IP"],[/文旅/i,"文旅","Travel"],[/宣传|招商/i,"宣传片","Promo"],[/访谈/i,"访谈","Interview"],[/纪录片/i,"纪录片","Doc"],[/短视频|短片/i,"短片","Short"],[/AI创作|ai创作/i,"AIGC","AIGC"],[/运营数据/i,"运营数据","Data"]];
function zhTag(c){const b=c.replace(/\*\*/g," ").replace(/^[\d.\s\u00b7·\-]+/,"").trim();for(const r of RULES){if(r[0].test(c)||r[0].test(b))return r[1];}return b;}
function tagOf(c){const b=c.replace(/\*\*/g," ").replace(/^[\d.\s\u00b7·\-]+/,"").trim();for(const r of RULES){if(r[0].test(c)||r[0].test(b))return lang==="en"?r[2]:r[1];}return b;}
const VIDS=RAW.filter(w=>!/运营数据|Analytics/i.test(w.cat));
const IMGS=RAW.filter(w=>/运营数据|Analytics/i.test(w.cat));
const CATS={};VIDS.forEach(w=>{(CATS[w.cat]=CATS[w.cat]||[]).push(w);});
const ORDER=["纪录片","短片","人物IP","文旅","宣传片","AIGC","访谈"];
const sortedKeys=Object.keys(CATS).sort((a,b)=>{const ra=ORDER.indexOf(zhTag(a)),rb=ORDER.indexOf(zhTag(b));return(ra<0?99:ra)-(rb<0?99:rb)||a.localeCompare(b,"zh");});

/* 语言切换 */
function renderStatic(){
  const d=T();
  document.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;if(d[k]!==undefined)el.textContent=d[k];});
  if(typeof d.skills==="string")document.querySelector("[data-k=skills]").innerHTML=d.skills.split(",").map(s=>`<span>${s}</span>`).join("");
  document.getElementById("jobs").innerHTML=d.jobs.map(j=>`<div class="job"><div class="t">${j[0]}</div><div class="o">${j[1]}</div><div class="r">${j[2]}</div></div>`).join("");
  document.getElementById("contact").innerHTML=d.contact.map(c=>`<div class="c-item"><div class="k">${c[1]}</div><div class="v">${/@/.test(c[2])?`<a href="mailto:${c[2]}">${c[2]}</a>`:c[2]}</div></div>`).join("");
  document.getElementById("langBtn").textContent=d.btn;
  document.getElementById("imgBtn").textContent=d.imgBtn;
  renderChips();renderGrid();renderImgBtn();
}
/* 作品 */
let activeCat="all",imgOn=false;
function renderChips(){
  const d=T();
  const el=document.getElementById("chips");
  el.innerHTML=[`<span class="chip active" data-c="all">${d.all} ${VIDS.length}</span>`].concat(sortedKeys.map(k=>`<span class="chip" data-c="${k}">${tagOf(k)} ${CATS[k].length}</span>`)).join("");
  el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{el.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");activeCat=c.dataset.c;renderGrid();}));
}
function renderGrid(){
  const d=T();const list=activeCat==="all"?VIDS:(CATS[activeCat]||[]);
  const g=document.getElementById("grid");
  if(!list.length){g.innerHTML=`<div class="empty">${d.none}</div>`;return;}
  g.innerHTML=list.map((w,i)=>`<div class="card" data-i="${i}"><div class="thumb">${isVid(w.file)?`<video muted preload="metadata" src="${w.file}"></video>`:`<img src="${w.file}">`}</div><span class="cat-tag">${tagOf(w.cat)}</span><span class="play-ico">▶</span><span class="title">${w.title||""}</span></div>`).join("");
  g.querySelectorAll(".card").forEach(cd=>cd.addEventListener("click",()=>openLb(+cd.dataset.i,"v")));
}
function renderImgBtn(){
  const b=document.getElementById("imgBtn");
  b.textContent=T().imgBtn+(imgOn?" ▲":" ▶");
  b.onclick=()=>{imgOn=!imgOn;renderImgBtn();const s=document.getElementById("imgSub");
    if(!imgOn){s.innerHTML="";return;}
    s.innerHTML=IMGS.length?`<div class="img-grid">${IMGS.map((w,i)=>`<div class="img-card" data-i="${i}"><img src="${w.file}" loading="lazy"><div class="img-cap">${w.title||""}</div></div>`).join("")}</div>`:`<div class="empty">${T().imgNone}</div>`;
    s.querySelectorAll(".img-card").forEach(cd=>cd.addEventListener("click",()=>openLb(+cd.dataset.i,"i")));};
}
/* 灯箱 */
const lb=document.getElementById("lb"),lbM=document.getElementById("lbMedia"),lbT=document.getElementById("lbTitle");
let mode="v",cur=-1;
const listOf=()=>mode==="v"?VIDS:IMGS;
function openLb(i,m){mode=m;const v=listOf();if(!v[i])return;cur=i;const w=v[i];
  lbM.innerHTML=isVid(w.file)?`<video src="${w.file}" controls autoplay playsinline></video>`:`<img src="${w.file}">`;
  lbT.textContent=w.title||"";lb.classList.add("open");}
document.getElementById("lbClose").onclick=()=>{lb.classList.remove("open");lbM.innerHTML="";};
lb.addEventListener("click",e=>{if(e.target===lb){lb.classList.remove("open");lbM.innerHTML="";}});
document.getElementById("lbPrev").onclick=e=>{e.stopPropagation();const v=listOf();openLb((cur-1+v.length)%v.length,mode);};
document.getElementById("lbNext").onclick=e=>{e.stopPropagation();const v=listOf();openLb((cur+1)%v.length,mode);};
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")document.getElementById("lbClose").click();if(e.key==="ArrowLeft")document.getElementById("lbPrev").click();if(e.key==="ArrowRight")document.getElementById("lbNext").click();});
function jump(id){document.getElementById(id).scrollIntoView({behavior:"smooth"});}
function toggleLang(){lang=lang==="zh"?"en":"zh";localStorage.setItem("pf_lang",lang);renderStatic();renderImgBtn();}
document.getElementById("year").textContent=new Date().getFullYear();
renderStatic();
</script>
</body>
</html>
