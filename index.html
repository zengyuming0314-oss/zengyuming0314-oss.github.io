<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>曾钰茗作品集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎬</text></svg>">
<style>
  :root{
    --bg:#f8f4ed; --panel:#fffdf8; --panel2:#f1ebe0; --line:rgba(61,43,25,.10); --line2:rgba(61,43,25,.20);
    --text:#2a2118; --dim:#6f6355; --faint:#a89a89; --coral:#ff6a4d; --amber:#ff9f43; --sun:#ffc14d; --teal:#2bb3a3;
    --grad:linear-gradient(92deg,#ff6a4d,#ff9f43 55%,#ffc14d);
    --ease:cubic-bezier(.22,1,.36,1);
    --radius:20px; --nav-h:74px;
    --fd:"Arial Narrow","Bahnschrift","DIN Alternate","PingFang SC","Microsoft YaHei",sans-serif;
    --fm:"Cascadia Code","JetBrains Mono","SF Mono",Consolas,monospace;
    --fs:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--text);font-family:var(--fs);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(640px 400px at 88% -8%,rgba(255,154,93,.16),transparent 65%),
      radial-gradient(720px 460px at -6% 30%,rgba(255,193,77,.14),transparent 65%),
      radial-gradient(640px 420px at 96% 62%,rgba(255,106,77,.09),transparent 65%),
      radial-gradient(520px 400px at 8% 108%,rgba(43,179,163,.08),transparent 65%)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 26px;position:relative;z-index:1}
  .lang-btn{position:fixed;top:18px;right:22px;z-index:95;border:1px solid var(--line2);background:rgba(255,253,248,.8);backdrop-filter:blur(10px);color:var(--text);border-radius:999px;padding:6px 16px;font-size:12px;cursor:pointer;font-family:var(--fm);letter-spacing:.1em;box-shadow:0 4px 14px rgba(61,43,25,.06);transition:all .3s var(--ease)}
  .lang-btn:hover{border-color:var(--coral);color:var(--coral);transform:translateY(-1px)}
  /* 导航 */
  nav{position:sticky;top:0;z-index:90;background:rgba(248,244,237,.78);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);height:var(--nav-h)}
  .nav-in{display:flex;align-items:center;gap:2px;max-width:1240px;margin:0 auto;padding:0 26px;height:100%;position:relative}
  .brand{font-family:var(--fd);font-weight:700;letter-spacing:.16em;margin-right:auto;font-size:19px;color:var(--text);white-space:nowrap}
  .brand em{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:normal}
  .nav-items{position:relative;display:flex;gap:2px}
  .nav-pill{position:absolute;top:50%;transform:translateY(-50%);left:0;height:38px;border-radius:999px;background:var(--grad);box-shadow:0 6px 18px rgba(255,106,77,.35);transition:left .45s var(--ease),width .45s var(--ease);opacity:0}
  .nav-pill.on{opacity:1}
  .nav-item{position:relative;z-index:2;border:none;background:none;color:var(--dim);padding:9px 15px;font-size:14px;cursor:pointer;white-space:nowrap;border-radius:999px;transition:color .3s var(--ease);font-weight:500}
  .nav-item .no{font-family:var(--fm);font-size:10.5px;margin-right:5px;opacity:.75}
  .nav-item.active{color:#fff}
  /* 区块 */
  section{padding:70px 0 14px;scroll-margin-top:calc(var(--nav-h) + 4px)}
  .sec-h{display:flex;align-items:baseline;gap:16px;margin-bottom:28px}
  .sec-h .no{font-family:var(--fm);font-size:13px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.15em}
  .sec-h h2{font-family:var(--fd);font-weight:700;font-size:clamp(26px,3.4vw,38px);letter-spacing:.1em;line-height:1}
  .sec-h .en{color:var(--faint);font-size:12px;letter-spacing:.22em;font-family:var(--fm);margin-left:auto;text-transform:uppercase}
  /* 入场动画 */
  .rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
  .rv.in{opacity:1;transform:none}
  .rv-d1{transition-delay:.06s}.rv-d2{transition-delay:.14s}.rv-d3{transition-delay:.22s}.rv-d4{transition-delay:.3s}
  /* 01 简介 */
  .hero{padding:44px 0 18px}
  .hero .tag{font-family:var(--fm);font-size:12px;letter-spacing:.32em;color:var(--faint);text-transform:uppercase}
  .hero h1{font-family:var(--fd);font-weight:700;font-size:clamp(44px,8vw,104px);letter-spacing:.03em;line-height:1.02;margin-top:10px}
  .hero h1 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .role{font-family:var(--fd);font-size:clamp(17px,2.2vw,23px);color:var(--dim);letter-spacing:.22em;margin-top:6px}
  .hero .meta{font-family:var(--fm);font-size:13px;color:var(--faint);display:flex;flex-wrap:wrap;gap:5px 22px;margin-top:14px}
  .hero .meta b{color:var(--dim);font-weight:400}
  .hero .tags{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .tag2{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:6px 16px;font-size:12.5px;color:var(--dim);font-family:var(--fm);letter-spacing:.03em;box-shadow:0 3px 10px rgba(61,43,25,.04);transition:all .3s var(--ease)}
  .tag2:hover{border-color:var(--amber);color:var(--text);transform:translateY(-2px)}
  .more-btn{margin-top:22px;border:none;background:var(--grad);color:#fff;border-radius:999px;padding:11px 26px;font-size:14px;cursor:pointer;font-weight:600;letter-spacing:.06em;box-shadow:0 8px 22px rgba(255,106,77,.35);transition:all .3s var(--ease)}
  .more-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,106,77,.45)}
  .detail{display:none;max-width:760px}
  .open .detail{display:block;animation:fadeUp .55s var(--ease)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .detail p{color:var(--dim);font-size:14.5px;margin:0 0 11px}
  /* 02 经历 */
  .job{border:1px solid var(--line);background:var(--panel);border-radius:16px;margin-bottom:12px;overflow:hidden;box-shadow:0 4px 16px rgba(61,43,25,.04);transition:all .35s var(--ease)}
  .job:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 10px 26px rgba(61,43,25,.08)}
  .job-head{display:flex;align-items:center;gap:20px;padding:17px 22px;cursor:pointer;flex-wrap:wrap}
  .job-head .t{font-family:var(--fm);font-size:12.5px;color:var(--coral);min-width:128px;letter-spacing:.02em;font-weight:600}
  .job-head .o{font-weight:700;font-size:15.5px}
  .job-head .r{color:var(--faint);font-size:12px;font-family:var(--fm);letter-spacing:.1em;text-transform:uppercase;background:var(--panel2);border-radius:999px;padding:3px 12px}
  .job-head .arr{margin-left:auto;color:var(--faint);transition:transform .35s var(--ease);font-size:13px}
  .job.open .job-head .arr{transform:rotate(90deg)}
  .job-body{display:none;padding:2px 22px 20px 170px;color:var(--dim);font-size:13.8px;animation:fadeUp .45s var(--ease)}
  .job.open .job-body{display:block}
  .job-body li{margin-bottom:4px}
  /* 03 作品 —— 全宽深色影院带（整体切深色，非卡片框；上下自然渐入渐出）*/
  #s-works{
    --bg:#0e0f12; --panel:#16181d; --panel2:#1e222b; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.2);
    --text:#eceef2; --dim:#9aa0ac; --faint:#6a7280; --coral:#e25555; --amber:#f0a35e; --sun:#ffce7a;
    --grad:linear-gradient(92deg,#e25555,#f0a35e 60%,#ffce7a);
    position:relative;width:100vw;margin-left:calc(50% - 50vw);
    background:radial-gradient(1100px 520px at 85% -12%,rgba(226,85,85,.16),transparent 60%),radial-gradient(900px 480px at -6% 112%,rgba(240,163,94,.12),transparent 60%),var(--bg);
    padding:120px clamp(18px,6vw,64px) 150px;margin-top:30px;margin-bottom:26px;
  }
  /* 上下边缘与亮色区域自然渐变衔接 */
  #s-works::before,#s-works::after{content:"";position:absolute;left:0;right:0;height:140px;pointer-events:none}
  #s-works::before{top:0;background:linear-gradient(to bottom,#f8f4ed 0%,rgba(248,244,237,.35) 40%,transparent)}
  #s-works::after{bottom:0;background:linear-gradient(to top,#f8f4ed 0%,rgba(248,244,237,.35) 40%,transparent)}
  #s-works .wall .card{background:var(--panel);box-shadow:0 12px 28px rgba(0,0,0,.45)}
  #s-works .wall .card:hover{box-shadow:0 22px 50px rgba(0,0,0,.6)}
  #s-works .img-btn{color:var(--dim);border-color:var(--line2)}
  #s-works .img-btn:hover{border-color:var(--coral);color:var(--coral);background:rgba(226,85,85,.08)}
  /* 放大镜效果：鼠标位置决定放大中心 */
  #s-works .card{cursor:zoom-in}
  #s-works .card .th img,#s-works .card .th video{transform-origin:var(--ox,50%) var(--oy,50%);transition:transform 1s var(--ease)}
  #s-works .card:hover .th img,#s-works .card:hover .th video{transform:scale(1.25)}
  @media(max-width:700px){#s-works{padding:80px 0 90px}}
  .chips{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 20px}
  .chip{border:1px solid var(--line2);background:var(--panel);color:var(--dim);border-radius:999px;padding:8px 19px;font-size:13.5px;cursor:pointer;font-family:var(--fd);letter-spacing:.07em;transition:all .3s var(--ease);box-shadow:0 3px 10px rgba(61,43,25,.04);font-weight:600}
  .chip:hover{color:var(--text);transform:translateY(-2px);border-color:var(--amber)}
  .chip.active{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(255,106,77,.35)}
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;padding-bottom:6px}
  .card{border-radius:var(--radius);overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer;position:relative;aspect-ratio:16/9;box-shadow:0 6px 20px rgba(61,43,25,.07);transition:transform .5s var(--ease),box-shadow .5s var(--ease);contain:layout paint}
  .card:hover{transform:translateY(-6px) scale(1.012);box-shadow:0 18px 42px rgba(61,43,25,.16)}
  .card .th{position:absolute;inset:0;background:#1a130c;overflow:hidden}
  .card .th img,.card .th video{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
  .card:hover .th img,.card:hover .th video{transform:scale(1.06)}
  .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(30,15,5,.82));opacity:.92;transition:opacity .4s var(--ease)}
  .card .np{position:absolute;inset:0;background:linear-gradient(150deg,#1d2027,#101319);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.28);font-size:40px}
  .ct{position:absolute;top:12px;left:12px;z-index:3;font-family:var(--fm);font-size:11px;letter-spacing:.08em;color:#fff;background:rgba(40,20,8,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.28);padding:4px 12px;border-radius:999px;text-transform:uppercase}
  .pv{position:absolute;top:50%;left:50%;transform:translate(-50%,-46%) scale(.8);z-index:3;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:var(--coral);font-size:20px;opacity:0;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:all .4s var(--ease)}
  .card:hover .pv{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .tt{position:absolute;left:16px;right:16px;bottom:13px;z-index:3;color:#fff;font-family:var(--fd);font-size:16px;font-weight:600;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .img-btn{margin:24px 0 2px;border:1.5px dashed var(--line2);background:transparent;color:var(--dim);border-radius:14px;padding:12px 22px;font-size:13.5px;cursor:pointer;font-weight:600;letter-spacing:.04em;transition:all .3s var(--ease)}
  .img-btn:hover{border-color:var(--coral);color:var(--coral);background:rgba(255,106,77,.05)}
  .imgs{display:none;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:18px}
  .imgs.show{display:grid}
  .imgc{border-radius:16px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:#fff;box-shadow:0 5px 16px rgba(61,43,25,.06);transition:all .35s var(--ease)}
  .imgc:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(61,43,25,.12)}
  .imgc img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .imgc .cap{padding:8px 13px;font-size:11.5px;color:var(--dim);font-family:var(--fm)}
  /* 04 技能 */
  .skill-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .skill{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius);padding:22px 24px;box-shadow:0 5px 18px rgba(61,43,25,.05);transition:all .4s var(--ease)}
  .skill:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(61,43,25,.1)}
  .skill h5{font-family:var(--fd);font-size:13px;letter-spacing:.22em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;text-transform:uppercase;margin-bottom:15px}
  .skill .sg{display:flex;gap:8px;flex-wrap:wrap}
  .skill .sg span{background:var(--panel2);color:var(--dim);border-radius:9px;padding:6px 13px;font-size:12.5px;font-family:var(--fm);letter-spacing:.01em;transition:all .25s var(--ease)}
  .skill .sg span:hover{background:var(--grad);color:#fff}
  /* 05 联系 */
  .contact{display:flex;gap:16px;flex-wrap:wrap;padding-bottom:60px}
  .c{border:1px solid var(--line);border-radius:var(--radius);padding:22px 28px;background:var(--panel);min-width:235px;box-shadow:0 5px 18px rgba(61,43,25,.05);transition:all .4s var(--ease)}
  .c:hover{transform:translateY(-4px);border-color:var(--amber);box-shadow:0 16px 34px rgba(61,43,25,.11)}
  .c .k{font-family:var(--fm);font-size:11px;letter-spacing:.25em;color:var(--faint);text-transform:uppercase}
  .c .v{font-size:16.5px;font-weight:700;margin-top:7px;word-break:break-all}
  .c .v a{color:var(--text);text-decoration:none;background:linear-gradient(var(--amber),var(--amber)) 0 100%/100% 2px no-repeat}
  .c .v a:hover{color:var(--coral)}
  footer{border-top:1px solid var(--line);padding:26px 0 44px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--fm);letter-spacing:.15em}
  .empty{padding:60px 20px;text-align:center;color:var(--faint);border:1.5px dashed var(--line2);border-radius:var(--radius);grid-column:1/-1;font-family:var(--fd);letter-spacing:.1em}
  /* 灯箱 */
  .lb{position:fixed;inset:0;background:rgba(26,16,8,.88);backdrop-filter:blur(10px);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
  .lb.open{opacity:1;pointer-events:auto}
  .lb-box{max-width:min(1120px,92vw);width:100%;max-height:90vh;background:#000;border-radius:24px;overflow:hidden;transform:scale(.94) translateY(16px);opacity:0;transition:all .45s var(--ease);display:flex;flex-direction:column;box-shadow:0 40px 90px rgba(0,0,0,.5)}
  .lb.open .lb-box{transform:none;opacity:1}
  .lb-media{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
  .lb-media video,.lb-media img{max-width:100%;max-height:calc(90vh - 84px);opacity:0;transition:opacity .4s var(--ease)}
  .lb-media video.on,.lb-media img.on{opacity:1}
  .lb-info{padding:13px 22px;background:#16100a;color:#fff;display:flex;align-items:center}
  .lb-info h3{font-size:14.5px;font-family:var(--fd);letter-spacing:.05em}
  .lb-close{position:fixed;top:18px;right:26px;font-size:30px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);width:44px;height:44px;border-radius:50%;cursor:pointer;z-index:101;transition:all .3s var(--ease)}
  .lb-close:hover{background:var(--coral);transform:rotate(90deg)}
  .lb-prev,.lb-next{position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#fff;width:50px;height:50px;border-radius:50%;font-size:18px;cursor:pointer;z-index:101;transition:all .3s var(--ease)}
  .lb-prev:hover,.lb-next:hover{background:var(--coral)}
  .lb-prev{left:16px}.lb-next{right:16px}
  @media(max-width:700px){.wrap{padding:0 18px}.nav-item{font-size:12.5px;padding:8px 10px}.nav-item .no{display:none}.job-body{padding-left:22px}.hero h1{font-size:46px}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
const D={
zh:{nameEn:"ZENG YUMING",about:"简介",career:"工作经历",works:"作品",skillsT:"技能",contact:"联系",
  objective:"短视频拍摄剪辑 · 内容运营",

let lang=localStorage.getItem("pf_lang")||(navigator.language&&navigator.language.toLowerCase().startsWith("zh")?"zh":"en");
const T=()=>D[lang];
const RAW=(window.WORKS||[]).map(w=>Object.assign({cat:"未分类"},w));
const isVid=f=>/\.(mp4|mov|webm|m4v)$/i.test(f);
const EN_SHORT={"人物IP":"Personal IP","文旅":"Travel","宣传片":"Promo","访谈":"Interview","纪录片":"Documentary","短片":"Short Film","AIGC":"AIGC","运营数据":"Analytics"};
const tagOf=k=>lang==="en"?(EN_SHORT[k]||k):k;
const VIDS=RAW.filter(w=>w.cat!=="运营数据");
const IMGS=RAW.filter(w=>w.cat==="运营数据");
const CATS={};VIDS.forEach(w=>{(CATS[w.cat]=CATS[w.cat]||[]).push(w);});
const ORDER=["纪录片","短片","人物IP","文旅","宣传片","AIGC","访谈"];
const sKeys=Object.keys(CATS).sort((a,b)=>{const ra=ORDER.indexOf(a),rb=ORDER.indexOf(b);return(ra<0?99:ra)-(rb<0?99:rb)||a.localeCompare(b,"zh");});

function renderStatic(){
  const d=T();
  document.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;if(d[k]!==undefined)el.textContent=d[k];});
  document.getElementById("meta").innerHTML=d.meta;
  document.querySelector("[data-k=tags]").innerHTML=d.tags.map(s=>`<span class="tag2">${s}</span>`).join("");
  const w=document.getElementById("aboutMore");
  w.innerHTML=`<div class="detail"><p>${d.aboutText.join("</p><p>")}</p></div><button class="more-btn" onclick="this.parentElement.classList.toggle('open')">${d.aboutMore}</button>`;
  document.getElementById("jobs").innerHTML=d.jobs.map(j=>`<div class="job rv"><div class="job-head" onclick="this.closest('.job').classList.toggle('open')"><div class="t">${j.t}</div><div class="o">${j.o}</div><div class="r">${j.r}</div><span class="arr">▸</span></div><div class="job-body"><ul>${j.d.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>`).join("");
  document.getElementById("skills").innerHTML=d.skillGroups.map(g=>`<div class="skill rv"><h5>${g[0]}</h5><div class="sg">${g[1].map(x=>`<span>${x}</span>`).join("")}</div></div>`).join("");
  document.getElementById("contact").innerHTML=d.contactInfo.map(c=>`<div class="c rv"><div class="k">${c[1]}</div><div class="v">${/@/.test(c[2])?`<a href="mailto:${c[2]}">${c[2]}</a>`:c[2]}</div></div>`).join("");
  document.getElementById("langBtn").textContent=d.btn;
  document.getElementById("imgBtn").textContent=d.imgBtn;
  renderChips();renderWall();watchReveal();
}
let activeCat="all";
function renderChips(){
  const d=T();const el=document.getElementById("chips");
  el.innerHTML=[`<span class="chip active" data-c="all">${d.all} ${VIDS.length}</span>`].concat(sKeys.map(k=>`<span class="chip" data-c="${k}">${tagOf(k)} ${CATS[k].length}</span>`)).join("");
  el.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{el.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));c.classList.add("active");activeCat=c.dataset.c;renderWall();}));
}
function renderWall(){
  const d=T();const list=activeCat==="all"?VIDS:(CATS[activeCat]||[]);
  const w=document.getElementById("wall");
  if(!list.length){w.innerHTML=`<div class="empty rv">${d.all==="全部"?"暂无作品":"No works yet"}</div>`;watchReveal();return;}
  w.innerHTML=list.map((v,i)=>`<div class="card" style="opacity:0;transform:translateY(22px) scale(.98);transition:opacity .55s var(--ease),transform .55s var(--ease)" data-i="${i}"><div class="th">${v.poster?`<img src="${v.poster}" loading="lazy">`:(isVid(v.file)?`<video muted preload="metadata" src="${v.file}"></video>`:`<img src="${v.file}" loading="lazy">`)}</div><span class="ct">${tagOf(v.cat)}</span><span class="pv">▶</span><span class="tt">${v.title||""}</span></div>`).join("");
  w.querySelectorAll(".card").forEach(cd=>cd.addEventListener("click",()=>openLb(+cd.dataset.i,"v")));
  w.querySelectorAll(".card").forEach(cd=>{cd.addEventListener("mousemove",e=>{const r=cd.getBoundingClientRect();cd.style.setProperty("--ox",((e.clientX-r.left)/r.width*100)+"%");cd.style.setProperty("--oy",((e.clientY-r.top)/r.height*100)+"%");});});
  [...w.children].forEach((el,j)=>setTimeout(()=>{el.style.opacity="1";el.style.transform="none";},j*55));
}
const imgBtn=document.getElementById("imgBtn"),imgs=document.getElementById("imgs");
imgBtn.onclick=()=>{imgs.classList.toggle("show");imgBtn.textContent=T().imgBtn+(imgs.classList.contains("show")?" ▲":" ▶");if(imgs.classList.contains("show"))renderImgs();};
function renderImgs(){
  imgs.innerHTML=IMGS.length?IMGS.map((v,i)=>`<div class="imgc rv" data-i="${i}"><img src="${v.file}" loading="lazy"><div class="cap">${v.title||""}</div></div>`).join(""):`<div class="empty rv">—</div>`;
  imgs.querySelectorAll(".imgc").forEach(cd=>cd.addEventListener("click",()=>openLb(+cd.dataset.i,"i")));
  watchReveal();
}
/* 灯箱 */
const lb=document.getElementById("lb"),lbM=document.getElementById("lbM"),lbT=document.getElementById("lbT");
let mode="v",cur=-1;const listOf=()=>mode==="v"?VIDS:IMGS;
function openLb(i,m){mode=m;const v=listOf();if(!v[i])return;cur=i;const x=v[i];
  lbM.innerHTML=isVid(x.file)?`<video src="${x.file}" controls autoplay playsinline></video>`:`<img src="${x.file}">`;
  lbT.textContent=x.title||"";lb.classList.add("open");
  const el=lbM.firstElementChild;requestAnimationFrame(()=>requestAnimationFrame(()=>el&&el.classList.add("on")));}
function closeLb(){lb.classList.remove("open");lbM.innerHTML="";}
document.getElementById("lbClose").onclick=closeLb;
lb.addEventListener("click",e=>{if(e.target===lb)closeLb();});
document.getElementById("lbPrev").onclick=e=>{e.stopPropagation();const v=listOf();openLb((cur-1+v.length)%v.length,mode);};
document.getElementById("lbNext").onclick=e=>{e.stopPropagation();const v=listOf();openLb((cur+1)%v.length,mode);};
document.addEventListener("keydown",e=>{if(!lb.classList.contains("open"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")document.getElementById("lbPrev").click();if(e.key==="ArrowRight")document.getElementById("lbNext").click();});
/* 导航滚动跟随 + 当前位置 */
const sections=[...document.querySelectorAll("section")];
const navItems=[...document.querySelectorAll(".nav-item")];
const pill=document.getElementById("navPill");
function movePill(btn){if(!btn)return;pill.style.width=btn.offsetWidth+"px";pill.style.left=btn.offsetLeft+"px";pill.classList.add("on");}
function setActive(sec){
  navItems.forEach(n=>n.classList.toggle("active",n.dataset.sec===sec));
  movePill(navItems.find(n=>n.dataset.sec===sec));
}
const spy=new IntersectionObserver(es=>{
  es.forEach(e=>{if(e.isIntersecting)setActive(e.target.id);});
},{rootMargin:"-42% 0px -52% 0px"});
sections.forEach(s=>spy.observe(s));
window.addEventListener("resize",()=>{const a=navItems.find(n=>n.classList.contains("active"));movePill(a);});
function jump(id){const el=document.getElementById(id);if(!el)return;setActive(id);el.scrollIntoView({behavior:"smooth"});}
/* 滚动出场 */
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.12});
function watchReveal(){document.querySelectorAll(".rv:not(.in)").forEach(el=>io.observe(el));}
/* 语言 */
function toggleLang(){lang=lang==="zh"?"en":"zh";localStorage.setItem("pf_lang",lang);renderStatic();}
document.getElementById("langBtn").onclick=toggleLang;
document.getElementById("year").textContent=new Date().getFullYear();
renderStatic();watchReveal();
requestAnimationFrame(()=>setActive("s-about"));
</script>
